<!doctype html>
<html>
  <head>
    <title>Website Security Checker</title>
  </head>

  <body>
    <h2>Check Website Security</h2>

    <input type="text" id="url" placeholder="Enter website URL" />

    <button onclick="checkSite()">Check</button>

    <p id="result"></p>

    <script>
      async function checkSite() {
        let url = document.getElementById('url').value;

        let response = await fetch(
          'https://ipqualityscore.com/api/json/url/YOUR_API_KEY/' + url,
        );

        let data = await response.json();

        if (data.unsafe == true) {
          document.getElementById('result').innerText = '⚠ Website Unsafe';
        } else {
          document.getElementById('result').innerText = '✔ Website Safe';
        }
      }
    </script>
  </body>
</html>
